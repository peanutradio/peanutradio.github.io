theme: jekyll-theme-chirpy

lang: ko
timezone: Asia/Seoul

title: Daniel Park
tagline: AI 에이전트를 만들며 남기는 기록 · Azure · Copilot Studio · AI Foundry

description: >-
  AI 에이전트를 직접 만들며 배운 것을 기록하는 기술 블로그.
  MCP·멀티에이전트 설계부터 Azure AI Foundry, Copilot Studio까지
  Microsoft 생태계에서의 실전 경험을 다룹니다.

url: "https://peanutradio.github.io"

github:
  username: peanutradio

social:
  name: Chan Hu Park (박찬후)
  email: pch8303@gmail.com
  links:
    - https://github.com/peanutradio
    - https://www.linkedin.com/in/chanhupark

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

pageviews:
  provider:

theme_mode: dark

cdn:

avatar: /assets/img/avatar.png

social_preview_image:

toc: true

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
